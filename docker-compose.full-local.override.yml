services:
  backend:
    ports: !override
      - "127.0.0.1:18001:8001"
    environment:
      - CORS_ORIGINS=http://localhost:13000,http://127.0.0.1:13000,http://localhost:3000,http://127.0.0.1:3000

  unified-agent:
    environment:
      - SERAPH_BACKEND_URL=http://127.0.0.1:18001

  frontend:
    build:
      args:
        - REACT_APP_BACKEND_URL=http://127.0.0.1:18001
    ports: !override
      - "127.0.0.1:13000:80"

  presence:
    ports: !override
      - "127.0.0.1:17070:7070"

  mongodb:
    ports: !override
      - "127.0.0.1:27018:27017"

  cuckoo-web:
    ports: !override
      - "127.0.0.1:18080:8080"

  nginx:
    ports: !override
      - "127.0.0.1:18088:80"
      - "127.0.0.1:18443:443"
