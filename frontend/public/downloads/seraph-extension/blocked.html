<!doctype html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width,initial-scale=1">
	<title>Blocked by Seraph AI</title>
	<style>
		:root {
			--neon-cyan: #00f0ff;
			--neon-pink: #ff2bd6;
			--bg-a: #06111e;
			--bg-b: #0b1f36;
			--panel: rgba(5, 20, 37, 0.88);
			--text: #dffaff;
			--muted: #9bd7e8;
		}
		* { box-sizing: border-box; }
		body {
			margin: 0;
			min-height: 100vh;
			display: flex;
			align-items: center;
			justify-content: center;
			padding: 16px;
			font-family: "JetBrains Mono", "IBM Plex Sans", system-ui, sans-serif;
			color: var(--text);
			background:
				radial-gradient(circle at 20% 0%, rgba(0, 240, 255, 0.22), transparent 42%),
				radial-gradient(circle at 100% 0%, rgba(255, 43, 214, 0.18), transparent 38%),
				linear-gradient(145deg, var(--bg-a), var(--bg-b));
		}
		.card {
			width: 100%;
			max-width: 640px;
			border: 1px solid rgba(0, 240, 255, 0.42);
			background: var(--panel);
			border-radius: 16px;
			padding: 24px;
			box-shadow: 0 0 28px rgba(0, 240, 255, 0.18);
		}
		.head {
			display: flex;
			align-items: center;
			gap: 14px;
			margin-bottom: 12px;
		}
		.head img {
			width: 52px;
			height: 52px;
			object-fit: contain;
			filter: drop-shadow(0 0 12px rgba(0, 240, 255, 0.55));
		}
		h1 {
			margin: 0;
			font-size: 1.2rem;
			text-transform: uppercase;
			letter-spacing: .08em;
			color: var(--neon-cyan);
			text-shadow: 0 0 14px rgba(0, 240, 255, 0.45);
		}
		p {
			margin: 8px 0;
			color: var(--muted);
			line-height: 1.5;
		}
		.reason {
			margin-top: 12px;
			border: 1px solid rgba(255, 43, 214, 0.38);
			background: rgba(255, 43, 214, 0.08);
			border-radius: 10px;
			padding: 12px;
			color: #ffd5f5;
		}
		.tip {
			margin-top: 12px;
			font-size: 12px;
			opacity: 0.9;
			text-transform: uppercase;
			letter-spacing: .06em;
		}
	</style>
</head>
<body>
	<div class="card">
		<div class="head">
			<img src="icons/icon48.png" alt="Seraph">
			<h1>Threat Destination Blocked</h1>
		</div>
		<p>Seraph AI prevented navigation because this destination matched a malicious profile or suspicious runtime pattern.</p>
		<p class="reason" id="reason"></p>
		<p class="tip">Review the destination and continue only after SOC verification.</p>
	</div>
	<script>
		const p = new URLSearchParams(location.search);
		document.getElementById('reason').textContent = `Reason: ${p.get('reason') || 'Suspicious destination'}`;
	</script>
</body>
</html>
