<!doctype html>
<html>
<head>
	<meta charset="utf-8">
	<title>Seraph AI Defender</title>
	<style>
		:root {
			--neon-cyan: #00f0ff;
			--neon-pink: #ff2bd6;
			--bg-a: #071423;
			--bg-b: #0b2440;
			--panel: rgba(7, 30, 54, 0.84);
			--border: rgba(0, 240, 255, 0.35);
			--text: #e6fbff;
			--muted: #9fd9e8;
		}
		* { box-sizing: border-box; }
		body {
			width: 336px;
			margin: 0;
			color: var(--text);
			font-family: "JetBrains Mono", "IBM Plex Sans", system-ui, sans-serif;
			background:
				radial-gradient(circle at 0% 0%, rgba(0, 240, 255, 0.22), transparent 42%),
				radial-gradient(circle at 100% 0%, rgba(255, 43, 214, 0.16), transparent 40%),
				linear-gradient(145deg, var(--bg-a), var(--bg-b));
			border: 1px solid rgba(0, 240, 255, 0.2);
		}
		.header {
			padding: 14px;
			border-bottom: 1px solid var(--border);
			display: flex;
			align-items: center;
			gap: 10px;
			background: linear-gradient(90deg, rgba(0, 240, 255, 0.15), rgba(255, 43, 214, 0.08));
		}
		.header img {
			width: 34px;
			height: 34px;
			object-fit: contain;
			filter: drop-shadow(0 0 8px rgba(0, 240, 255, 0.45));
		}
		.title {
			margin: 0;
			font-size: 13px;
			letter-spacing: .06em;
			text-transform: uppercase;
			text-shadow: 0 0 12px rgba(0, 240, 255, 0.4);
		}
		.status {
			display: flex;
			align-items: center;
			gap: 8px;
			padding: 10px 14px;
			font-size: 11px;
			color: var(--muted);
		}
		.dot {
			width: 8px;
			height: 8px;
			border-radius: 50%;
			background: #39ff14;
			box-shadow: 0 0 8px #39ff14;
			animation: pulse 1.8s infinite;
		}
		@keyframes pulse {
			0%, 100% { transform: scale(1); opacity: 1; }
			50% { transform: scale(1.35); opacity: .75; }
		}
		.stats {
			display: grid;
			grid-template-columns: 1fr 1fr;
			gap: 10px;
			padding: 12px 14px 14px;
		}
		.stat {
			background: var(--panel);
			border: 1px solid var(--border);
			border-radius: 10px;
			padding: 10px;
			text-align: center;
		}
		.value {
			font-size: 24px;
			font-weight: 700;
			color: var(--neon-cyan);
			text-shadow: 0 0 16px rgba(0, 240, 255, 0.5);
		}
		.label {
			margin-top: 3px;
			font-size: 10px;
			letter-spacing: .08em;
			text-transform: uppercase;
			color: var(--muted);
		}
		.footer {
			border-top: 1px solid var(--border);
			padding: 9px 14px 12px;
			font-size: 10px;
			letter-spacing: .06em;
			color: rgba(185, 241, 255, 0.75);
			text-transform: uppercase;
		}
	</style>
</head>
<body>
	<div class="header">
		<img src="icons/icon32.png" alt="Seraph">
		<h1 class="title">Seraph Browser Defender</h1>
	</div>
	<div class="status">
		<span class="dot"></span>
		Runtime Protection Active
	</div>
	<div class="stats">
		<div class="stat">
			<div class="value" id="blocked">0</div>
			<div class="label">Sites Blocked</div>
		</div>
		<div class="stat">
			<div class="value" id="alerts">0</div>
			<div class="label">Threat Events</div>
		</div>
	</div>
	<div class="footer">Seraph AI telemetry linked</div>
	<script src="popup.js"></script>
</body>
</html>
